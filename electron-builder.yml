appId: org.advancedcalc.calculator
productName: آلة حاسبة متقدمة
copyright: Copyright © 2026 AdvancedCalc

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

asar: true
compression: normal

win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: آلة حاسبة متقدمة
  uninstallDisplayName: آلة حاسبة متقدمة
  artifactName: AdvancedCalc-Setup-${version}.${ext}

portable:
  artifactName: AdvancedCalc-Portable-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  maintainer: AdvancedCalc
  synopsis: آلة حاسبة متقدمة — Advanced Calculator
